<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="module" src="src/js/projets.js" defer></script>
    <script src="src/js/bg.js" defer></script>

    <link href="src/css/output.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="src/css/bg.css">
    <link rel="stylesheet" type="text/css" href="src/css/folder.css">
    <link rel="stylesheet" type="text/css" href="src/css/animation.css">

    <link rel="icon" href="src/images/logo/icon.png" type="image/svg+xml">
    <title id="titreSite">Archive - Nicolas Mongrain - Vitrine</title>
</head>

<body class="bg-space z-0">
    <!-- Halo souris -->
    <div id="cursor-glow" class="fixed w-22.5 h-22.5 pointer-events-none rounded-full -z-10 blur-[60px] 
        -translate-x-1/2 -translate-y-1/2">
    </div>

    <main class="z-30 text-[#EEF8FF]">
        <a href="index.html" class="absolute top-12 left-15 fadeSlideDown-anim text-[#EEF8FF] hover:text-[#6AADF4] transform 
        hover:scale-110 transition duration-450" style="animation-delay: 0.4s;">
            <svg class="w-7 h-7 sm:w-9 sm:h-9 md:w-11 md:h-11" viewBox="0 0 16 16" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0" />
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" />
                <g id="SVGRepo_iconCarrier">
                    <path d="M1 6V15H6V11C6 9.89543 6.89543 9 8 9C9.10457 9 10 9.89543 10 11V15H15V6L8 0L1 6Z"
                        fill="currentColor" />
                </g>
            </svg>
        </a>

        <div class="flex flex-col  items-center mt-8">
            <h1 id="titre" class="text-xl md:text-3xl font-bold">Titre</h1>

            <div class="w-full flex justify-center mt-8 px-5 fadeSlideDown-anim" style="animation-delay: 0.45s;">
                <div class="relative w-full max-w-2xl">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#6AADF4]"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" />
                    </svg>

                    <input id="searchProjet" type="text" placeholder="Rechercher un projet..."
                    class="w-full rounded-xl border border-[#32557C] bg-[#0B1320]/70 backdrop-blur-md py-3 pl-12 pr-4 text-[#EEF8FF]
                   placeholder:text-[#8EA7C5]focus:outline-none focus:border-[#6AADF4] focus:ring-2 focus:ring-[#6AADF4]/30
                   transition-all duration-300">
                </div>
            </div>


            <div id="dossier" class="grid grid-cols-3 mt-10 gap-10">

            </div>

        </div>
    </main>
</body>
